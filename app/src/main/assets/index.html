<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Discord LAN Voice Call</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #313338; color: #DBDEE1; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .header { height: 48px; background: #2B2D31; border-bottom: 1px solid #1E1F22; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: bold; font-size: 14px; shrink: 0; }
    .badge { font-size: 11px; color: #23A55A; background: rgba(35,165,90,0.15); padding: 3px 8px; border-radius: 4px; font-family: monospace; }
    .grid { flex: 1; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; overflow-y: auto; }
    .user-card { background: #2B2D31; border: 2px solid #1E1F22; border-radius: 16px; width: 100%; max-width: 300px; aspect-ratio: 4/3; max-height: 35vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; transition: all 0.15s; }
    .user-card.speaking { border-color: #23A55A; box-shadow: 0 0 20px rgba(35,165,90,0.5); }
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #10B981, #0D9488); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: white; margin-bottom: 10px; }
    .name { font-size: 12px; font-weight: 600; color: white; background: #1E1F22; padding: 3px 10px; border-radius: 10px; }
    .meter { position: absolute; bottom: 10px; width: 100px; height: 4px; background: #1E1F22; border-radius: 2px; overflow: hidden; }
    .meter-bar { height: 100%; width: 0%; background: #23A55A; transition: width 0.05s linear; }
    .controls { height: 64px; background: #2B2D31; border-top: 1px solid #1E1F22; display: flex; align-items: center; justify-content: center; gap: 16px; shrink: 0; }
    .btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #35373C; color: white; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn.active { background: #DA373C; }
  </style>
</head>
<body>
  <div class="header">
    <div>🔊 general-voice</div>
    <div id="status" class="badge">Voice Active</div>
  </div>

  <div class="grid">
    <div id="card" class="user-card">
      <div class="avatar">📱</div>
      <div class="name">My Phone (Android APK)</div>
      <div class="meter"><div id="meterBar" class="meter-bar"></div></div>
    </div>
  </div>

  <div class="controls">
    <button id="muteBtn" class="btn">🎤</button>
  </div>

  <script>
    let ws, audioCtx, micStream, processor, isMuted = false;
    const statusEl = document.getElementById('status');
    const cardEl = document.getElementById('card');
    const barEl = document.getElementById('meterBar');
    const muteBtn = document.getElementById('muteBtn');

    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);

        const data = new Uint8Array(analyser.frequencyBinCount);
        const loop = () => {
          if (!isMuted) {
            analyser.getByteFrequencyData(data);
            const avg = data.reduce((a, b) => a + b, 0) / data.length;
            const vol = Math.min(100, Math.round(avg * 2));
            barEl.style.width = vol + '%';
            if (vol > 15) cardEl.classList.add('speaking');
            else cardEl.classList.remove('speaking');
          } else {
            barEl.style.width = '0%';
            cardEl.classList.remove('speaking');
          }
          requestAnimationFrame(loop);
        };
        loop();
      } catch (e) {
        statusEl.textContent = 'Mic Error';
      }
    }

    muteBtn.onclick = () => {
      isMuted = !isMuted;
      muteBtn.classList.toggle('active', isMuted);
      muteBtn.textContent = isMuted ? '🔇' : '🎤';
    };

    init();
  </script>
</body>
</html>
